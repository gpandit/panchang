name: ThePandit
options:
  bundleIdPrefix: com.pandit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  ThePandit:
    type: application
    platform: iOS
    sources:
      - path: ThePandit/Sources/ThePandit
      - path: Theming
        excludes:
          - "*.md"
    info:
      path: ThePandit/Info.plist
      properties:
        CFBundleDisplayName: The Pandit
        CFBundleIdentifier: com.pandit.ios
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Location is used to calculate accurate Panchang for your area."
        NSUserNotificationUsageDescription: "Enable notifications to receive reminders for auspicious times and festivals."
    settings:
      base:
        INFOPLIST_FILE: ThePandit/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.pandit.ios
    capabilities:
      push-notifications: {}
      background-modes:
        modes:
          - remote-notification
    dependencies:
      - sdk: SwiftData.framework

  ThePanditTests:
    type: bundle.unit-test
    platform: iOS
    sources: ThePanditTests
    dependencies:
      - target: ThePandit
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ThePandit.app/ThePandit"
