[project]
name = "the-pandit-festivals"
version = "0.1.0"
description = "The Pandit — Festival & Vrat rule engine (resolves rules to dates per location/scheme)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.10",
    "the-pandit-panchang",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/festivals"]

[tool.uv.sources]
the-pandit-panchang = { workspace = true }
