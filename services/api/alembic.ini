# Alembic configuration for the API gateway.
#
# The database URL is NOT set here — env.py reads it from the application settings
# (API_DATABASE_URL), so migrations always target the same database the app uses.
#
# Run from the directory containing this file (the image copies it to /app):
#   python -m alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
# Use OS-native path separators when generating version files.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
