# Nginx reverse proxy — staging
# Internal-only; not exposed publicly until the commercial licence gate clears.

upstream admin_upstream {
    server admin:80;
    keepalive 8;
}

upstream temple_admin_upstream {
    server temple-admin:80;
    keepalive 8;
}

upstream grafana_upstream {
    server grafana:3000;
    keepalive 8;
}

# ── Shared proxy settings ─────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── API Gateway — api.pandit.xyz ───────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.pandit.xyz;

    ssl_certificate     /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Re-resolve the api container's IP via Docker's embedded DNS so a
    # `docker compose up -d api` recreate doesn't require an nginx restart.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api:8000;

    # CDN edge caching for read-heavy Panchang + calendar paths
    location ~ ^/v1/panchang {
        proxy_pass http://$api_upstream;
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/v1/calendar {
        proxy_pass http://$api_upstream;
        proxy_cache_valid 200 30m;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://$api_upstream/healthz;
        access_log off;
    }
}

# ── Web app — pandit.xyz ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name pandit.xyz www.pandit.xyz;

    ssl_certificate     /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Re-resolve the web container's IP via Docker's embedded DNS so a
    # `docker compose up -d web` recreate doesn't require an nginx restart.
    resolver 127.0.0.11 valid=10s;
    set $web_upstream web:3000;

    location /_next/static {
        proxy_pass http://$web_upstream;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Admin console — admin.pandit.xyz ───────────────────────────────────────────
server {
    listen 443 ssl;
    server_name admin.pandit.xyz;

    ssl_certificate     /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Temple admin console — temple.pandit.xyz ───────────────────────────────────
server {
    listen 443 ssl;
    server_name temple.pandit.xyz;

    ssl_certificate     /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://temple_admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Grafana — grafana.pandit.xyz ────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name grafana.pandit.xyz;

    ssl_certificate     /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana live/websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
