groups:
  # ── Panchang + calendar read-path SLOs ─────────────────────────────────────
  - name: panchang_slo
    interval: 30s
    rules:
      # SLO: p95 latency ≤ 200 ms on the Panchang read path
      - alert: PanchangLatencyHigh
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{
              job="pandit-api",
              handler=~"/v1/panchang.*"
            }[5m])
          ) > 0.2
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Panchang read-path p95 latency above 200 ms"
          description: "p95={{ $value | humanizeDuration }} on {{ $labels.handler }}"

      # SLO: p95 latency ≤ 300 ms on the calendar read path
      - alert: CalendarLatencyHigh
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{
              job="pandit-api",
              handler=~"/v1/calendar.*"
            }[5m])
          ) > 0.3
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Calendar read-path p95 latency above 300 ms"
          description: "p95={{ $value | humanizeDuration }}"

      # SLO: error rate < 1 % on read paths
      - alert: PanchangErrorRateHigh
        expr: |
          rate(http_requests_total{
            job="pandit-api",
            handler=~"/v1/panchang.*|/v1/calendar.*",
            status=~"5.."
          }[5m])
          /
          rate(http_requests_total{
            job="pandit-api",
            handler=~"/v1/panchang.*|/v1/calendar.*"
          }[5m])
          > 0.01
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Panchang/calendar error rate above 1 %"
          description: "Error rate = {{ $value | humanizePercentage }}"

  # ── Cache health ──────────────────────────────────────────────────────────────
  - name: cache_health
    interval: 30s
    rules:
      # Alert on sustained cache-miss spike (miss rate > 20 % for 5 min)
      - alert: PanchangCacheMissSpike
        expr: |
          rate(pandit_cache_miss_total{cache="panchang"}[5m])
          /
          (rate(pandit_cache_hit_total{cache="panchang"}[5m]) + rate(pandit_cache_miss_total{cache="panchang"}[5m]))
          > 0.20
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Panchang cache miss rate above 20 %"
          description: "Miss rate = {{ $value | humanizePercentage }} — check cache-warm job"

      # Redis down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Redis is unreachable"

  # ── Queue backlogs ────────────────────────────────────────────────────────────
  - name: queue_health
    interval: 30s
    rules:
      # PDF queue: backlog > 50 jobs for > 10 min
      - alert: PDFQueueBacklog
        expr: pandit_queue_length{queue="pdf"} > 50
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "PDF generation queue backlog > 50"
          description: "Queue length = {{ $value }}"

      # Reminder queue backlog > 200 for > 5 min
      - alert: ReminderQueueBacklog
        expr: pandit_queue_length{queue="reminders"} > 200
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Reminder queue backlog > 200"

  # ── Service availability ──────────────────────────────────────────────────────
  - name: availability
    rules:
      - alert: APIServiceDown
        expr: up{job="pandit-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API gateway is down"

      - alert: PanchangServiceDown
        expr: up{job="pandit-panchang"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Panchang computation service is down"

      - alert: WebAppDown
        expr: up{job="pandit-web"} == 0
        for: 2m
        labels:
          severity: warning
          team: frontend
        annotations:
          summary: "Web app is unreachable"
