global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: staging

rule_files:
  - alerting-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pandit-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: pandit-panchang
    static_configs:
      - targets: ["panchang:8001"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: pandit-web
    static_configs:
      - targets: ["web:3000"]
    metrics_path: /api/metrics
    scrape_interval: 30s

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
