# Staging stack — The Pandit
#
# Usage (from repo root):
#   docker compose -f infra/docker-compose.staging.yml up -d
#
# All config is injected via environment variables.  In CI/CD these are pulled
# from the secret store.  For a local staging-equivalent run copy
# infra/env.staging.example to .env.staging and pass --env-file .env.staging.
#
# BUILD_PROFILE=staging keeps the engine on the AGPL flag.
# Internal-only: this stack must not be exposed publicly until the commercial
# licence gate (Step 3.8) clears.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"
    labels: "service,env"

x-api-env: &api-env
  API_ENVIRONMENT: staging
  API_DEBUG: "false"
  API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  API_REDIS_URL: redis://redis:6379/0
  API_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  API_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  API_S3_SECRET_KEY: ${S3_SECRET_KEY}
  API_S3_BUCKET: ${S3_BUCKET:-pandit-staging}
  API_SECRET_KEY: ${API_SECRET_KEY}
  API_PANCHANG_SERVICE_URL: http://panchang:8001
  API_RATE_LIMIT_PER_MINUTE: "60"
  # Licence/profile come from the env file; default to the safe staging/AGPL build.
  # Set both to production/commercial in .env.prod once the commercial licence lands.
  PANCHANG_BUILD_PROFILE: ${PANCHANG_BUILD_PROFILE:-staging}
  PANCHANG_EPHEMERIS_LICENSE: ${PANCHANG_EPHEMERIS_LICENSE:-agpl}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAME: pandit-api
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pandit_staging}
      POSTGRES_USER: ${POSTGRES_USER:-pandit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pandit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --loglevel notice --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Domain services ──────────────────────────────────────────────────────────
  panchang:
    image: ${IMAGE_REGISTRY}/pandit-panchang:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: services/panchang/Dockerfile
    restart: unless-stopped
    environment:
      PANCHANG_BUILD_PROFILE: ${PANCHANG_BUILD_PROFILE:-staging}
      PANCHANG_EPHEMERIS_LICENSE: ${PANCHANG_EPHEMERIS_LICENSE:-agpl}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: pandit-panchang
      OTEL_TRACES_EXPORTER: otlp
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  api:
    image: ${IMAGE_REGISTRY}/pandit-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      panchang:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  worker:
    image: ${IMAGE_REGISTRY}/pandit-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "api.worker"]
    environment:
      <<: *api-env
      WORKER_QUEUES: "pdf,reminders,cache-warm"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  web:
    image: ${IMAGE_REGISTRY}/pandit-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.pandit.xyz/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.pandit.xyz/v1
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

  admin:
    image: ${IMAGE_REGISTRY}/pandit-admin:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: https://api.pandit.xyz/v1
    restart: unless-stopped
    logging: *default-logging

  # ── Edge / reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      # Place staging.crt / staging.key (Cloudflare Origin or Let's Encrypt) in
      # infra/nginx/certs/ on the host — nginx needs them to bind every :443 server.
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
      - admin
      - grafana
    logging: *default-logging

  # ── Observability ────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_ROOT_URL: https://grafana.pandit.xyz
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    # Alertmanager's config file does not support ${VAR} substitution natively,
    # so the mounted file is a template with ${SLACK_WEBHOOK_URL} placeholders.
    # Substitute it into a writable path before launching alertmanager.
    entrypoint: ["sh", "-c"]
    command:
      - >
        sed "s#\${SLACK_WEBHOOK_URL}#$$SLACK_WEBHOOK_URL#g"
        /etc/alertmanager/config.yml.tpl > /tmp/config.yml &&
        exec /bin/alertmanager --config.file=/tmp/config.yml --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml.tpl:/etc/alertmanager/config.yml.tpl:ro
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
