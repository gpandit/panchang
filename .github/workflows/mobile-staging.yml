name: Mobile — Staging Distribution

# Upload new TestFlight (iOS) and Play internal-testing (Android) builds on
# every successful staging deploy or on manual trigger.

on:
  workflow_run:
    workflows: ["Staging Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build (ios / android / both)"
        required: false
        default: both

concurrency:
  group: mobile-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_API_URL: https://api-staging.thepandit.app/v1

jobs:
  # ── iOS → TestFlight ────────────────────────────────────────────────────────
  ios-testflight:
    name: iOS → TestFlight
    if: |
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both'))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Install CocoaPods (if Podfile exists)
        working-directory: apps/ios
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

      - name: Set staging API URL in build config
        working-directory: apps/ios
        run: |
          # Inject the staging API base URL via a user-defined build setting.
          # The app reads PANDIT_API_BASE_URL from Info.plist / build config.
          /usr/libexec/PlistBuddy -c \
            "Set :PanditAPIBaseURL ${STAGING_API_URL}" \
            ThePandit/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Add :PanditAPIBaseURL string ${STAGING_API_URL}" \
            ThePandit/Info.plist

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Download provisioning profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: com.pandit.ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          profile-type: IOS_APP_ADHOC

      - name: Build archive
        working-directory: apps/ios
        run: |
          xcodebuild archive \
            -project ThePandit.xcodeproj \
            -scheme ThePandit \
            -configuration Release \
            -archivePath /tmp/ThePandit.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            PRODUCT_BUNDLE_IDENTIFIER=com.pandit.ios \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>APPLE_TEAM_ID_PLACEHOLDER</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          # Replace placeholder with the actual team ID at runtime
          sed -i '' "s/APPLE_TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/g" /tmp/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath /tmp/ThePandit.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath /tmp/ThePanditIPA

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: /tmp/ThePanditIPA/ThePandit.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Summary
        run: |
          echo "## iOS TestFlight build uploaded" >> $GITHUB_STEP_SUMMARY
          echo "Build number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "API: ${STAGING_API_URL}" >> $GITHUB_STEP_SUMMARY
          echo "Testers: invite via App Store Connect → TestFlight" >> $GITHUB_STEP_SUMMARY

  # ── Android → Play Internal Testing ────────────────────────────────────────
  android-play-internal:
    name: Android → Play Internal Testing
    if: |
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both'))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Set staging API URL
        working-directory: apps/android
        run: |
          # Override the default release URL with the staging URL via Gradle property.
          cat >> gradle.properties << 'EOF'
          pandit.api.baseUrl=https://api-staging.thepandit.app/v1/
          EOF

      - name: Build release AAB
        working-directory: apps/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -PversionCode=${{ github.run_number }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

      - name: Upload to Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pandit.android
          releaseFiles: apps/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          whatsNewDirectory: apps/android/whatsnew

      - name: Summary
        run: |
          echo "## Android Play Internal Testing build uploaded" >> $GITHUB_STEP_SUMMARY
          echo "Build number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "API: ${STAGING_API_URL}" >> $GITHUB_STEP_SUMMARY
          echo "Testers: Google Play Console → Internal Testing" >> $GITHUB_STEP_SUMMARY
