name: Staging Deploy

# Trigger: every merge to main, plus manual dispatch for hot-fixes.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to sha)"
        required: false

concurrency:
  group: staging-deploy
  cancel-in-progress: false   # never cancel a running deploy mid-way

env:
  # All image names share this registry prefix.  Set REGISTRY in repo secrets.
  REGISTRY: ${{ secrets.IMAGE_REGISTRY || 'ghcr.io/gpandit' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
  BUILD_PROFILE: staging
  PANCHANG_EPHEMERIS_LICENSE: agpl   # commercial licence is a hard launch gate

jobs:
  # ── 1. Build and push Docker images ────────────────────────────────────────
  # Note: CI (.github/workflows/ci.yml) already runs on every push to main via
  # its own `on: push` trigger and is enforced as a required status check on
  # main, so it isn't re-invoked here. (A `uses: ./.github/workflows/ci.yml`
  # reusable-workflow call is invalid unless ci.yml declares `on: workflow_call`,
  # which would make this entire file fail to parse — 0 jobs, 0s runtime.)
  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: pandit-api
            dockerfile: services/api/Dockerfile
          - name: pandit-panchang
            dockerfile: services/panchang/Dockerfile
          - name: pandit-web
            dockerfile: apps/web/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.pandit.xyz
          - name: pandit-admin
            dockerfile: apps/admin/Dockerfile
            build_args: |
              VITE_API_URL=https://api.pandit.xyz/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:staging-latest
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ── 2. Run database migrations ─────────────────────────────────────────────
  migrate:
    name: Run migrations
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Alembic migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            ${{ env.REGISTRY }}/pandit-api:${{ env.IMAGE_TAG }} \
            python -m alembic upgrade head
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

  # ── 3. Deploy to staging ───────────────────────────────────────────────────
  deploy:
    name: Deploy to staging
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://pandit.xyz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Note: pandit-prod-1's /opt/pandit-prod/.env.staging is maintained
      # directly on the server (POSTGRES_*, REDIS_PASSWORD, API_SECRET_KEY,
      # S3_*, etc.). It is NOT regenerated here — overwriting it from a
      # partial secrets list previously caused redis/postgres/panchang to be
      # recreated with blank credentials and crash-loop. Update it on the
      # server directly if a credential needs to change.

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY
          script: |
            set -euo pipefail
            cd /opt/pandit-prod

            # Pull the compose file and configs from the deployed ref
            git fetch origin main && git reset --hard ${{ github.sha }}

            # Pull all new images
            IMAGE_TAG=${IMAGE_TAG} \
            IMAGE_REGISTRY=${REGISTRY} \
              docker compose --env-file .env.staging -f infra/docker-compose.staging.yml pull

            # Rolling restart: infra first, then services
            IMAGE_TAG=${IMAGE_TAG} \
            IMAGE_REGISTRY=${REGISTRY} \
              docker compose --env-file .env.staging -f infra/docker-compose.staging.yml \
                up -d --remove-orphans \
                postgres redis otel-collector prometheus alertmanager

            # Give infra 15 s to stabilise
            sleep 15

            IMAGE_TAG=${IMAGE_TAG} \
            IMAGE_REGISTRY=${REGISTRY} \
              docker compose --env-file .env.staging -f infra/docker-compose.staging.yml \
                up -d panchang api worker web admin nginx grafana

      - name: Smoke check (healthz)
        run: |
          for url in \
            https://api.pandit.xyz/health \
            https://pandit.xyz/ \
            https://admin.pandit.xyz/healthz; do
            echo "Checking $url ..."
            for i in $(seq 1 10); do
              if curl -sf --max-time 5 "$url" > /dev/null; then
                echo "  OK"
                break
              fi
              echo "  Attempt $i failed, retrying in 10s..."
              sleep 10
            done
          done

      - name: Post deploy summary
        if: always()
        run: |
          echo "## Staging Deploy" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|-|-|" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web | https://pandit.xyz |" >> $GITHUB_STEP_SUMMARY
          echo "| API | https://api.pandit.xyz/docs |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin | https://admin.pandit.xyz |" >> $GITHUB_STEP_SUMMARY
          echo "| Grafana | https://grafana.pandit.xyz |" >> $GITHUB_STEP_SUMMARY

  # ── 4. Run E2E smoke tests against staging ─────────────────────────────────
  e2e-smoke:
    name: E2E smoke tests
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install httpx pytest pytest-asyncio

      - name: Run smoke tests
        run: pytest tests/e2e/smoke_test.py -v --tb=short
        env:
          STAGING_API_URL: https://api.pandit.xyz
          STAGING_WEB_URL: https://pandit.xyz
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
