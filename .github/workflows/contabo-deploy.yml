name: Contabo Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to sha)"
        required: false

concurrency:
  group: contabo-deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.IMAGE_REGISTRY || 'ghcr.io/gpandit' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
  BUILD_PROFILE: staging
  PANCHANG_EPHEMERIS_LICENSE: agpl

jobs:
  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: pandit-api
            dockerfile: services/api/Dockerfile
          - name: pandit-panchang
            dockerfile: services/panchang/Dockerfile
          - name: pandit-web
            dockerfile: apps/web/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.pandit.xyz
          - name: pandit-admin
            dockerfile: apps/admin/Dockerfile
            build_args: |
              VITE_API_URL=https://api.pandit.xyz/v1
          - name: pandit-temple-admin
            dockerfile: apps/temple-admin/Dockerfile
            build_args: |
              VITE_API_URL=https://api.pandit.xyz/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:staging-latest
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  migrate:
    name: Run migrations
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Alembic migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            ${{ env.REGISTRY }}/pandit-api:${{ env.IMAGE_TAG }} \
            python -m alembic upgrade head

  deploy:
    name: Deploy to Contabo
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://pandit.xyz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_SSH_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY
          script: |
            set -euo pipefail
            cd /opt/pandit-prod
            git fetch origin main && git reset --hard ${{ github.sha }}
            IMAGE_TAG=${IMAGE_TAG} \
            IMAGE_REGISTRY=${REGISTRY} \
              docker compose --env-file .env.staging -f infra/docker-compose.staging.yml pull
            IMAGE_TAG=${IMAGE_TAG} \
            IMAGE_REGISTRY=${REGISTRY} \
              docker compose --env-file .env.staging -f infra/docker-compose.staging.yml \
                up -d --remove-orphans postgres redis otel-collector prometheus alertmanager
            sleep 15
            IMAGE_TAG=${IMAGE_TAG} \
            IMAGE_REGISTRY=${REGISTRY} \
              docker compose --env-file .env.staging -f infra/docker-compose.staging.yml \
                up -d panchang api worker web admin temple-admin nginx grafana

      - name: Smoke check
        run: |
          for url in https://api.pandit.xyz/health https://pandit.xyz/; do
            echo "Checking $url ..."
            for i in $(seq 1 10); do
              if curl -sf --max-time 5 "$url" > /dev/null 2>&1; then
                echo "  ✓ OK"
                break
              fi
              echo "  Attempt $i/10 failed, retrying in 10s..."
              sleep 10
            done
          done

      - name: Post deploy summary
        if: always()
        run: |
          echo "## Contabo Deploy" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|-|-|" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web | https://pandit.xyz |" >> $GITHUB_STEP_SUMMARY
          echo "| API | https://api.pandit.xyz/docs |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin | https://admin.pandit.xyz |" >> $GITHUB_STEP_SUMMARY
