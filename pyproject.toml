# Root pyproject.toml — uv workspace configuration
# Python tooling (ruff, mypy) is configured here for the entire services/ tree.
# Each service has its own pyproject.toml for its dependencies.

[tool.uv.workspace]
members = ["services/panchang", "services/api", "services/festivals"]

# ─── Ruff (lint + format) ─────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "B008",   # FastAPI Depends() in argument defaults is intentional
    "N812",   # lowercase module imported as non-lowercase alias (e.g. constants as C)
    "N818",   # exception name without Error suffix (pre-existing in oauth module)
    "RUF002", # ambiguous Unicode in docstrings (intentional in panchang math notation)
    "RUF003", # ambiguous Unicode in comments (intentional in panchang math notation)
]

[tool.ruff.lint.isort]
known-first-party = ["panchang", "api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["swisseph", "swisseph.*", "passlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["panchang", "panchang.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false

# ─── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["services", "tools"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["services/panchang/src", "services/api/src", "services/festivals/src"]
addopts = "--import-mode=importlib"
norecursedirs = [".venv", "node_modules", ".git", "__pycache__"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]
