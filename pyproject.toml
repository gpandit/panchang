# Root pyproject.toml — uv workspace configuration
# Python tooling (ruff, mypy) is configured here for the entire services/ tree.
# Each service has its own pyproject.toml for its dependencies.

[tool.uv.workspace]
members = ["services/panchang", "services/api"]

# ─── Ruff (lint + format) ─────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line-too-long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["panchang", "api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["swisseph", "boto3", "botocore.*", "fpdf"]
ignore_missing_imports = true

# Only the engine calls the untyped swisseph C extension directly.
[[tool.mypy.overrides]]
module = ["panchang.engine"]
ignore_errors = true

# ─── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["services", "tools"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = [".", "services/panchang/src", "services/api/src"]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "mypy>=1.11.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]
