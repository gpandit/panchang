<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" style="font-family:var(--font-sans)" xmlns:xlink="http://www.w3.org/1999/xlink" height="560"><style>
    :root { --color-text-primary: #1F2937;
