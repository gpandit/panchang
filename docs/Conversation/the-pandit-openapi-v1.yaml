x-entitlement-matrix:
  basic: Daily Panchang, day/month views, major festivals, up to 5 notes/bookmarks/reminders, 1 location
  silver: All views, unlimited notes/reminders, Tithi recurrence, vrat tracker, basic muhurat, family up to 5, 12-month print,
    Book a Pandit
  gold: Advanced muhurat, AI, planners, HD 12–15-month print, unlimited family, samagri checklist, journal, reduced marketplace
    fee
x-payment-rails:
  iap: Apple In-App Purchase — subscriptions only
  play: Google Play Billing — subscriptions only
  stripe_web: Stripe Checkout on web — subscriptions only
  stripe_connect: Stripe Connect — pandit bookings only (escrow, payouts, refunds)
  shopify_checkout: Shopify-hosted checkout — physical goods only
