        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      - &id001
        name: lat
        in: query
        required: false
        schema:
          type: number
      - &id002
        name: lon
        in: query
        required: false
        schema:
          type: number
      - &id003
        name: tz
        in: query
        required: false
        schema:
          type: string
      - &id004
        name: ayanamsa
        in: query
        required: false
        schema:
          type: string
          enum:
          - lahiri
          - raman
          - kp
          - true_chitra
      - &id005
        name: scheme
        in: query
        required: false
        schema:
          type: string
          enum:
          - amanta
          - purnimanta
