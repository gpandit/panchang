components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Entitlement or role check failed; body includes requiredTier when applicable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code: &id006
          type: string
        message: *id006
        details:
          type: object
        requiredTier:
          type: string
          nullable: true
      required:
      - code
      - message
    OidcExchange:
      type: object
      properties:
        idToken: *id006
        nonce: *id006
      required:
      - idToken
    OtpRequest:
      type: object
      properties:
        channel:
          type: string
          enum:
          - email
          - sms
        destination: *id006
      required:
      - channel
      - destination
    OtpVerify:
      type: object
      properties:
        destination: *id006
        code: *id006
      required:
      - destination
      - code
    RefreshRequest:
      type: object
      properties:
        refreshToken: *id006
      required:
      - refreshToken
    TokenPair:
      type: object
      properties:
        accessToken: *id006
        refreshToken: *id006
        expiresIn: &id010
          type: integer
      required:
      - accessToken
      - refreshToken
    Preferences:
      type: object
      properties:
        locale: *id006
        scheme:
          type: string
          enum:
          - amanta
          - purnimanta
        ayanamsa: *id006
        samvat:
          type: string
          enum:
          - vikram
          - shaka
          - gujarati
        regionalCalendar: *id006
        timeFormat:
          type: string
          enum:
          - 12h
          - 24h
          - 24plus
        region: *id006
        deity: *id006
    User:
      type: object
      properties:
        id: &id008
          type: string
          format: uuid
        displayName: *id006
        tier:
          type: string
          enum:
          - basic
          - silver
          - gold
        roles:
          type: array
          items:
            type: string
            enum:
            - patron
            - pandit
            - seller
            - admin
            - ops
            - editor
        preferences:
          $ref: '#/components/schemas/Preferences'
        hasBirthDetails: &id009
          type: boolean
      required:
      - id
      - tier
    UserUpdate:
      type: object
      properties:
        displayName: *id006
        preferences:
          $ref: '#/components/schemas/Preferences'
    LocationCreate:
      type: object
      properties:
        label: *id006
        lat: &id007
          type: number
        lon: *id007
        tz: *id006
      required:
      - lat
      - lon
      - tz
    BirthDetails:
      type: object
      properties:
        dateOfBirth: &id012
          type: string
          format: date
        timeOfBirth:
          type: string
          pattern: ^\d{2}:\d{2}$
        placeOfBirth:
          $ref: '#/components/schemas/LocationCreate'
      required:
      - dateOfBirth
      description: Stored only in the Vault; never returned in profile payloads
    Location:
      type: object
      properties:
        id: *id008
        label: *id006
        lat: *id007
        lon: *id007
        tz: *id006
        gridCell: *id006
      required:
      - id
      - lat
      - lon
      - tz
    LocationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
    DeviceToken:
      type: object
      properties:
        platform:
          type: string
          enum:
          - ios
          - android
          - web
        token: *id006
      required:
      - platform
      - token
    NotificationPrefs:
      type: object
      properties:
        quietHours:
          type: object
          properties:
            start: *id006
            end: *id006
        categories:
          type: object
          additionalProperties: *id009
        dailySummaryTime: *id006
        language: *id006
        sound: *id006
    Interval:
      type: object
      properties:
        name: *id006
        index: *id010
        startUtc: &id011
          type: string
          format: date-time
        endUtc: *id011
        localOffsetMinutes: *id010
        hoursFromSunrise:
          type: number
          description: First-class 24-plus value; may exceed 24
        flags:
          type: array
          items:
            type: string
            enum:
            - kshaya
            - vriddhi
            - carriesOver
            - sunriseFallback
      required:
      - startUtc
      - endUtc
      - hoursFromSunrise
    PanchangDay:
      type: object
      properties:
        date: *id012
        gridCell: *id006
        tz: *id006
        ayanamsa: *id006
        scheme: *id006
        sunrise: *id011
        sunset: *id011
        moonrise:
          type: string
          format: date-time
          nullable: true
        moonset:
          type: string
          format: date-time
          nullable: true
        sunriseFallback: *id009
        vara: *id006
        tithi:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
        nakshatra:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
        yoga:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
        karana:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
        paksha:
          type: string
          enum:
          - shukla
          - krishna
        amantaMonth: *id006
        purnimantaMonth: *id006
        adhikaMaas: *id009
        kshayaMaas: *id009
        moonsign: *id006
        sunsign: *id006
        samvat:
          type: object
          properties:
            vikram: *id010
            shaka: *id010
            gujarati: *id010
            samvatsara: *id006
        ritu: *id006
        ayana: *id006
        windows:
          type: object
          properties:
            rahuKalam:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            yamaganda:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            gulika:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            abhijit:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            durMuhurat:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            varjyam:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            amritKalam:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            brahmaMuhurat:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            nishita:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            choghadiya:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            hora:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
            gowri:
              type: array
              items:
                $ref: '#/components/schemas/Interval'
        moonPhase: *id007
        festivalOccurrenceIds:
          type: array
          items:
            type: string
        engineVersion: *id006
      required:
      - date
      - gridCell
      - sunrise
      - sunset
      - tithi
      - nakshatra
    PanchangDayList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PanchangDay'
      required:
      - items
    DayCell:
      type: object
      properties:
        date: *id012
        hinduDate: *id006
        tithiAtSunrise: *id006
        nakshatraAtSunrise: *id006
        moonPhase: *id007
        festivals:
          type: array
          items:
            type: string
        indicators:
          type: array
          items:
            type: string
            enum:
            - ekadashi
            - purnima
            - amavasya
            - sankranti
            - pradosham
            - chaturthi
        userMarkers:
          type: object
          properties:
            notes: *id010
            bookmarks: *id010
            reminders: *id010
    FestivalSummary:
      type: object
      properties:
        id: *id006
        name: *id006
        date: *id012
        category: *id006
        regions:
          type: array
          items:
            type: string
      required:
      - id
      - name
      - date
    FestivalList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FestivalSummary'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
    MonthView:
      type: object
      properties:
        year: *id010
        month: *id010
