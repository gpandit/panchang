openapi: 3.1.0
info:
  title: The Pandit API
  version: 1.0.0-skeleton
  description: 'Public API contract for The Pandit — Panchang platform plus Pandit Services (Addendum A) and Pooja Items (Addendum
    B) marketplaces.


    Conventions: all instants are UTC ISO-8601; every Panchang interval also carries localOffsetMinutes and hoursFromSunrise
    (24-plus). Money is in minor units. Cursor pagination. Entitlement tier per operation is declared in x-entitlement and
    enforced at the gateway (403 + requiredTier). Money operations declare their rail in x-payment-rail; rails are never mixed.
    Clients never compute Panchang or prices.'
  contact:
    name: Aqualeo — The Pandit
servers:
- url: https://api.thepandit.app
  description: Production
- url: https://api.staging.thepandit.app
  description: Staging
security:
- bearerAuth: []
tags:
- name: Auth
- name: Users
- name: Panchang
- name: Calendar
- name: Festivals
- name: Vrats
- name: Muhurat
- name: Planner
- name: Notes
- name: Bookmarks
- name: Reminders
- name: Family
- name: Journal
- name: PrintCalendar
- name: Search
- name: AI
- name: Content
- name: Share
- name: Subscriptions
- name: Pandits
- name: Bookings
- name: Disputes
- name: Reviews
- name: Video
- name: Messaging
- name: Provider
- name: Shop
- name: Notifications
- name: Admin
- name: Webhooks
- name: Internal
paths:
  /v1/auth/oidc/{provider}:
    post:
      tags:
      - Auth
      summary: Exchange OIDC token
      operationId: exchange_oidc_token
